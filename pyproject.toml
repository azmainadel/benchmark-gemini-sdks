[project]
name = "llm-sdk-benchmarks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agno>=3.1.0",
    "fastapi>=0.142.2",
    "google-genai>=2.26.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "litellm>=1.103.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyright]
include = ["app", "scripts", "tests"]
extraPaths = ["."]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 90
target-version = "py312"
